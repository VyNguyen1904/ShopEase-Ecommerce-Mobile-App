services:
  postgres:
    image: postgres:17
    container_name: shopease-postgres
    environment:
      POSTGRES_DB: shopease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopease"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migration:
    build:
      context: ../shopease-parent
      dockerfile: order-service/Dockerfile
    command:
      - --spring.main.web-application-type=none
      - --spring.kafka.listener.auto-startup=false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ../shopease-parent
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
    ports:
      - "8081:8081"
    depends_on:
      db-migration:
        condition: service_completed_successfully

  product-service:
    build:
      context: ../shopease-parent
      dockerfile: product-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      INVENTORY_SERVICE_URI: http://inventory-service:8083
    ports:
      - "8082:8082"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      inventory-service:
        condition: service_started

  inventory-service:
    build:
      context: ../shopease-parent
      dockerfile: inventory-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  cart-service:
    build:
      context: ../shopease-parent
      dockerfile: cart-service/Dockerfile
    ports:
      - "8084:8084"

  order-service:
    build:
      context: ../shopease-parent
      dockerfile: order-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8086
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  payment-service:
    build:
      context: ../shopease-parent
      dockerfile: payment-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      ORDER_SERVICE_URI: http://order-service:8085
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  review-service:
    build:
      context: ../shopease-parent
      dockerfile: review-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      ORDER_SERVICE_URI: http://order-service:8085
    ports:
      - "8089:8089"
    depends_on:
      db-migration:
        condition: service_completed_successfully
      order-service:
        condition: service_started

  gateway-service:
    build:
      context: ../shopease-parent
      dockerfile: gateway-service/Dockerfile
    environment:
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      CART_SERVICE_URI: http://cart-service:8084
      ORDER_SERVICE_URI: http://order-service:8085
      PAYMENT_SERVICE_URI: http://payment-service:8086
      REVIEW_SERVICE_URI: http://review-service:8089
      SEARCH_SERVICE_URI: http://product-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - payment-service
      - review-service

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

volumes:
  postgres-data:
