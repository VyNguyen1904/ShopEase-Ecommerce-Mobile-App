services:
  postgres:
    image: postgres:17
    container_name: shopease-postgres
    environment:
      POSTGRES_DB: shopease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopease"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopease-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  authentication-service:
    build:
      context: ../backend
      dockerfile: authentication-service/Dockerfile
    ports:
      - "8088:8088"

  product-service:
    build:
      context: ../backend
      dockerfile: product-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      INVENTORY_SERVICE_URI: http://inventory-service:8083
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started

  inventory-service:
    build:
      context: ../backend
      dockerfile: inventory-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  cart-service:
    build:
      context: ../backend
      dockerfile: cart-service/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PRODUCT_SERVICE_URI: http://product-service:8082
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ../backend
      dockerfile: order-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8086
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    build:
      context: ../backend
      dockerfile: payment-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      ORDER_SERVICE_URI: http://order-service:8085
      KAFKA_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  review-service:
    build:
      context: ../backend
      dockerfile: review-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      ORDER_SERVICE_URI: http://order-service:8085
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started

  gateway-service:
    build:
      context: ../backend
      dockerfile: gateway-service/Dockerfile
    environment:
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      CART_SERVICE_URI: http://cart-service:8084
      ORDER_SERVICE_URI: http://order-service:8085
      PAYMENT_SERVICE_URI: http://payment-service:8086
      REVIEW_SERVICE_URI: http://review-service:8089
      SEARCH_SERVICE_URI: http://product-service:8082
      AUTH_SERVICE_URI: http://authentication-service:8088
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      authentication-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      review-service:
        condition: service_started

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

volumes:
  postgres-data:
