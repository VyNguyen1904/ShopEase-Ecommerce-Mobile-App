version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: shopease-postgres
    environment:
      POSTGRES_DB: shopease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopease"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopease-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: shopease-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: shopease-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  authentication-service:
    build:
      context: ./backend
      dockerfile: authentication-service/Dockerfile
    container_name: shopease-authentication-service
    ports:
      - "8088:8088"
    environment:
      JWT_SECRET: U7CSWNhO7HE9fSam/uQx2UyK8LyCArTLsCb+2u+W3rA=

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: shopease-user-service
    ports:
      - "8081:8081"
    env_file:
      - backend/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: U7CSWNhO7HE9fSam/uQx2UyK8LyCArTLsCb+2u+W3rA=

  product-service:
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: shopease-product-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      KAFKA_SERVERS: kafka:9092

  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory-service/Dockerfile
    container_name: shopease-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092

  cart-service:
    build:
      context: ./backend
      dockerfile: cart-service/Dockerfile
    container_name: shopease-cart-service
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRODUCT_SERVICE_URI: http://product-service:8082

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: shopease-order-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8086
      SPRING_FLYWAY_ENABLED: "true"

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: shopease-payment-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_SERVERS: kafka:9092

  review-service:
    build:
      context: ./backend
      dockerfile: review-service/Dockerfile
    container_name: shopease-review-service
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres
      ORDER_SERVICE_URI: http://order-service:8085

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: shopease-chat-service
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopease
      DB_USER: postgres
      DB_PASS: postgres

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    container_name: shopease-gateway-service
    ports:
      - "8000:8080"
    depends_on:
      - authentication-service
      - user-service
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - payment-service
      - review-service
      - chat-service
    environment:
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      CART_SERVICE_URI: http://cart-service:8084
      ORDER_SERVICE_URI: http://order-service:8085
      PAYMENT_SERVICE_URI: http://payment-service:8086
      REVIEW_SERVICE_URI: http://review-service:8089
      AUTH_SERVICE_URI: http://authentication-service:8088
      CHAT_SERVICE_URI: http://chat-service:8090
      CHAT_SERVICE_WS_URI: ws://chat-service:8090

volumes:
  postgres-data:
