spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopease_orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8085
clients:
  product-service:
    url: ${PRODUCT_SERVICE_URI:http://localhost:8082}
  inventory-service:
    url: ${INVENTORY_SERVICE_URI:http://localhost:8083}
  payment-service:
    url: ${PAYMENT_SERVICE_URI:http://localhost:8086}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
management.endpoints.web.exposure.include: health,info
