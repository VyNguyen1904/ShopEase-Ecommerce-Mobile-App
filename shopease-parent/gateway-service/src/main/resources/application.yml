spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/inventory/**
        - id: cart-service
          uri: ${CART_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
        - id: review-service
          uri: ${REVIEW_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/reviews/**
        - id: search-service
          uri: ${SEARCH_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/search/**
server:
  port: 8080
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
